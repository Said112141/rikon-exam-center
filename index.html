
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIKON'S EXAM CENTER</title>
    <link rel="stylesheet" href="style.css">

    <!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- FIREBASE CONFIG -->
<script src="firebase-config.js"></script>
</head>

<body>

    <header>
        <h1>RIKON'S EXAM CENTER</h1>
        <p>Your Personal Examination Management System</p>
    </header>

    <main>

        <section class="welcome">
            <h2>Welcome to RIKON'S EXAM CENTER</h2>
            <p>Prepare yourself and achieve your goals.</p>

            <button class="btn-primary" onclick="showLogin()">Student Login</button>
            <button class="btn-secondary" onclick="showRegister()">Create Account</button>
        </section>

       
<!-- LOGIN -->
<section id="loginSection" class="auth-section" style="display:none;">

    <h2>Student Login</h2>

    <form id="loginForm">

        <label>Email Address</label>
        <input type="email" id="loginEmail" required>

        <label>Password</label>
        <input type="password" id="loginPassword" required>

        <button type="submit">Login</button>

    </form>

    <p style="text-align:right; margin-top:10px;">
        <a href="#" id="forgotPasswordLink"
           style="color:#2563eb; text-decoration:none;">
            Forgot Password?
        </a>
    </p>

    <p id="loginMessage"></p>
    <p id="forgotPasswordMessage"></p>

</section>


        <!-- REGISTRATION -->
        <section id="registerSection" class="auth-section" style="display:none;">

            <h2>Student Registration</h2>

            <form id="registerForm">

                <label>Full Name</label>
                <input type="text" id="studentName" required>

                <label>Email Address</label>

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Enter your email address"
                    required
                >

                <label>Mobile Number</label>

                <input
                    type="tel"
                    id="studentPhone"
                    placeholder="01712345678"
                    pattern="01[3-9][0-9]{8}"
                    maxlength="11"
                    inputmode="numeric"
                    title="Enter a valid 11-digit Bangladesh mobile number"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="studentPassword"
                    minlength="6"
                    required
                >

                <button type="submit">Create Account</button>

            </form>

            <p id="registerMessage"></p>

        </section>

    </main>

    <footer>
        <p>© 2026 RIKON'S EXAM CENTER | All Rights Reserved</p>
    </footer>

    <script>

        // SHOW LOGIN
        function showLogin() {

            document.getElementById("loginSection").style.display = "block";
            document.getElementById("registerSection").style.display = "none";

        }

        // SHOW REGISTRATION
        function showRegister() {

            document.getElementById("registerSection").style.display = "block";
            document.getElementById("loginSection").style.display = "none";

        }

        // AUTH FLOW GUARD + AUTO-REDIRECT FOR ALREADY SIGNED-IN STUDENTS
        let authFlowInProgress = false;

        auth.onAuthStateChanged(async function(user) {

            if (authFlowInProgress) {
                return;
            }

            if (!user) {
                return;
            }

            try {

                const studentDoc = await db.collection("students")
                    .doc(user.uid)
                    .get();

                if (!studentDoc.exists) {
                    return;
                }

                const student = studentDoc.data();

                if (student.status !== "active") {
                    return;
                }

                if (Number(student.restrictedUntil || 0) > Date.now()) {
                    return;
                }

                if (
                    student.verificationMethod === "firebase-email" &&
                    !user.emailVerified
                ) {
                    return;
                }

                window.location.href = "student-dashboard.html";

            } catch (error) {

                console.error("Auth State Check Failed:", error);

            }

        });

// STUDENT REGISTRATION
document.getElementById("registerForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const name = document.getElementById("studentName").value.trim();
    const email = document.getElementById("studentEmail").value.trim().toLowerCase();
    const phone = document.getElementById("studentPhone").value.trim();
    const password = document.getElementById("studentPassword").value;
    const message = document.getElementById("registerMessage");

    if (!name) {
        message.style.color = "red";
        message.textContent = "Please enter your full name!";
        return;
    }

    const phonePattern = /^01[3-9]\d{8}$/;

    if (!phonePattern.test(phone)) {
        message.style.color = "red";
        message.textContent = "Please enter a valid 11-digit Bangladesh mobile number!";
        return;
    }

    if (password.length < 6) {
        message.style.color = "red";
        message.textContent = "Password must contain at least 6 characters!";
        return;
    }

    authFlowInProgress = true;

    try {
        message.style.color = "blue";
        message.textContent = "Creating your account...";

        // CREATE FIREBASE AUTH ACCOUNT
        const userCredential = await auth.createUserWithEmailAndPassword(
            email,
            password
        );

        const user = userCredential.user;

        // SAVE STUDENT DATA TO FIRESTORE
        const newStudent = {
            id: user.uid,
            name: name,
            email: email,
            phone: phone,
            status: "active",
            restrictedUntil: 0,
            restrictionReason: "",
            emailVerified: false,
            verificationMethod: "firebase-email",
            createdAt: Date.now()
        };

        try {

            // SEND FIREBASE EMAIL VERIFICATION LINK
            await user.sendEmailVerification();

            await db.collection("students")
                .doc(user.uid)
                .set(newStudent);

        } catch (writeError) {

            // ROLLBACK: REMOVE THE AUTH ACCOUNT SO NO ORPHAN LOGIN REMAINS
            try {
                await user.delete();
            } catch (deleteError) {
                console.error("Registration Rollback Failed:", deleteError);
            }

            throw writeError;

        }

        // DO NOT LOG IN YET: THE STUDENT MUST VERIFY THE EMAIL FIRST
        await auth.signOut();

        localStorage.removeItem("rikon_current_student");

        authFlowInProgress = false;

        document.getElementById("registerForm").reset();

        message.style.color = "green";
        message.textContent =
            "Account created successfully! A verification link has been sent to your email. Please verify your email, then login.";

    } catch (error) {
        authFlowInProgress = false;

        console.error("Student Registration Failed:", error);

        message.style.color = "red";

        if (error.code === "auth/email-already-in-use") {
            message.textContent = "This email is already registered!";
        } else if (error.code === "auth/weak-password") {
            message.textContent = "Password is too weak!";
        } else {
            message.textContent = "Registration Failed: " + error.message;
        }
    }

});



        
// STUDENT LOGIN
document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");

    authFlowInProgress = true;

    try {
        message.style.color = "blue";
        message.textContent = "Logging in...";

        // FIREBASE AUTHENTICATION
        const userCredential = await auth.signInWithEmailAndPassword(
            email,
            password
        );

        const user = userCredential.user;

        // GET STUDENT DATA FROM FIRESTORE
        const studentDoc = await db.collection("students")
            .doc(user.uid)
            .get();

        if (!studentDoc.exists) {
            await auth.signOut();

            localStorage.removeItem("rikon_current_student");

            authFlowInProgress = false;

            message.style.color = "red";
            message.textContent = "Student account data not found!";
            return;
        }

        const student = studentDoc.data();

        // CHECK BLOCK STATUS
        if (student.status === "blocked") {
            await auth.signOut();

            localStorage.removeItem("rikon_current_student");

            authFlowInProgress = false;

            message.style.color = "red";
            message.textContent =
                "Your account has been blocked by Admin. Please contact Admin.";

            return;
        }

        // CHECK TEMPORARY RESTRICTION
        if (Number(student.restrictedUntil || 0) > Date.now()) {
            await auth.signOut();

            localStorage.removeItem("rikon_current_student");

            authFlowInProgress = false;

            message.style.color = "red";
            message.textContent =
                "Your account is temporarily restricted. Reason: " +
                (student.restrictionReason || "Not specified");

            return;
        }

        // CHECK FIREBASE EMAIL VERIFICATION (NEW ACCOUNTS ONLY;
        // LEGACY ACCOUNTS WITHOUT verificationMethod LOG IN AS BEFORE)
        if (student.verificationMethod === "firebase-email") {

            try {
                await user.reload();
            } catch (reloadError) {
                console.error("Email Verification Check Failed:", reloadError);
            }

            const currentUser = auth.currentUser || user;

            if (!currentUser.emailVerified) {

                try {
                    await currentUser.sendEmailVerification();
                } catch (resendError) {
                    console.error("Verification Resend Failed:", resendError);
                }

                await auth.signOut();

                localStorage.removeItem("rikon_current_student");

                authFlowInProgress = false;

                message.style.color = "red";
                message.textContent =
                    "Please verify your email before logging in. A new verification link has been sent to your email. Verify your email, then login again.";

                return;
            }

        }

        // SAVE CURRENT STUDENT SESSION
        localStorage.setItem(
            "rikon_current_student",
            JSON.stringify({
                id: user.uid,
                name: student.name,
                email: student.email,
                phone: student.phone || ""
            })
        );

        alert("Login successful! Welcome " + student.name);

        window.location.href = "student-dashboard.html";

    } catch (error) {
        authFlowInProgress = false;

        console.error("Student Login Failed:", error);

        message.style.color = "red";

        if (
            error.code === "auth/user-not-found" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/invalid-credential"
        ) {
            message.textContent = "Incorrect email or password!";
        } else {
            message.textContent = "Login Failed: " + error.message;
        }
    }

});

// FORGOT PASSWORD - FIREBASE EMAIL RESET
document.getElementById("forgotPasswordLink").addEventListener("click", async function(event) {

    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const message = document.getElementById("forgotPasswordMessage");

    message.style.color = "red";

    if (!email) {
        message.textContent = "Please enter your registered email address first.";
        document.getElementById("loginEmail").focus();
        return;
    }

    try {
        message.style.color = "blue";
        message.textContent = "Sending password reset link...";

        await auth.sendPasswordResetEmail(email);

        message.style.color = "green";
        message.textContent =
            "Password reset link sent! Please check your Gmail inbox.";

    } catch (error) {
        console.error("Password Reset Error:", error);

        message.style.color = "red";

        if (error.code === "auth/invalid-email") {
            message.textContent = "Please enter a valid email address.";
        } else if (error.code === "auth/too-many-requests") {
            message.textContent = "Too many attempts. Please try again later.";
        } else {
            message.textContent = "Unable to send reset link. Please try again.";
        }
    }
});


    </script>

</body>
</html>
