<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - RIKON EXAM CENTER</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e40af);
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #1e40af;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loginMessage {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #dc2626;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h1>RIKON EXAM CENTER</h1>

        <p class="subtitle">Admin & Moderator Login</p>

        <form id="adminLoginForm">

            <label>Email Address</label>
            <input
                type="email"
                id="adminEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="adminPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit" id="loginButton">
                Login to Dashboard
            </button>

        </form>

        <div id="loginMessage"></div>

        <div class="footer">
            Secure Staff Access
        </div>

    </div>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="../firebase-config.js"></script>

    <script>
        const loginForm = document.getElementById("adminLoginForm");
        const loginMessage = document.getElementById("loginMessage");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("adminEmail").value.trim();
            const password = document.getElementById("adminPassword").value;

            loginButton.disabled = true;
            loginButton.textContent = "Checking...";
            loginMessage.textContent = "";

            try {

                const credential = await adminAuth.signInWithEmailAndPassword(
                    email,
                    password
                );

                const user = credential.user;

              const userDoc = await adminDb
                    .collection("users")
                    .doc(user.uid)
                    .get();

                if (!userDoc.exists) {
                    throw new Error("Staff account not found.");
                }

                const userData = userDoc.data();

                const allowedRoles = ["superadmin", "admin", "moderator"];

                if (
                    userData.status !== "active" ||
                    !allowedRoles.includes(userData.role)
                ) {
                    throw new Error("You are not authorized to access this dashboard.");
                }

                window.location.href = "admin.html";

            } catch (error) {

                console.error("Login Error:", error);

                loginMessage.textContent =
                    error.code === "auth/invalid-credential"
                        ? "Incorrect email or password."
                        : error.message || "Login failed.";

                if (adminAuth.currentUser) {
                    await adminAuth.signOut();
                }

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "Login to Dashboard";

            }

        });
    </script>

</body>
</html>
